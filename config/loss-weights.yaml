# Per-DOF flow-loss weights. Pass via `--loss-weights config/loss-weights.yaml`.
# Loaded by crossformer.model.components.heads.loss_terms:load_loss_weights.
#
# Sections (both optional; every DOF defaults to 1.0):
#   bodypart: part_name -> weight            (scalar weights the whole part)
#             part_name -> [w0..w_{dim-1}]   (list weights each DOF in the part)
#   dof:      dof_name  -> weight            (token names from crossformer/embody.py DOF;
#                                             applied after bodypart, so it wins)
#
# Weights fold into the loss mask; masked_mean renormalizes by the weight sum,
# so they are relative — downweighting one part upweights everything else.
# Per-view parts (kp3dc) share DOF ids, so a weight applies to all view copies.

bodypart:
  # kp3dc layout: 14 keypoints x xyz, KP_CHAIN order:
  #   link_base, link1..link7, link_eef, link_tcp,
  #   left/right_finger_joint, left/right_finger_tip
  # Downweight the arm links (link1..link7); keep base/eef/tcp/fingers at 1.0.
  kp3dc: [
    1.0, 1.0, 1.0,  # link_base
    0.1, 0.1, 0.1,  # link1
    0.1, 0.1, 0.1,  # link2
    0.1, 0.1, 0.1,  # link3
    0.1, 0.1, 0.1,  # link4
    0.1, 0.1, 0.1,  # link5
    0.1, 0.1, 0.1,  # link6
    0.1, 0.1, 0.1,  # link7
    1.0, 1.0, 1.0,  # link_eef
    1.0, 1.0, 1.0,  # link_tcp
    1.0, 1.0, 1.0,  # left_finger_joint
    1.0, 1.0, 1.0,  # right_finger_joint
    1.0, 1.0, 1.0,  # left_finger_tip
    1.0, 1.0, 1.0,  # right_finger_tip
  ]

  # kp3dc_hand layout (HUMAN embodiment): 21 MANO joints x xyz.
  # Order: wrist, then 4 joints per finger (thumb, index, middle, ring, pinky)
  # with the tip last in each group. Mirror kp3dc: keep the wrist (root) and
  # fingertips (contact points) at 1.0, downweight intermediate joints.
  kp3dc_hand: [
    1.0, 1.0, 1.0,  # *0  wrist
    0.1, 0.1, 0.1,  # 1  thumb_cmc
    0.1, 0.1, 0.1,  # 2  thumb_mcp
    0.1, 0.1, 0.1,  # 3  thumb_ip
    1.0, 1.0, 1.0,  # *4  thumb_tip
    0.1, 0.1, 0.1,  # 5  index_mcp
    0.1, 0.1, 0.1,  # 6  index_pip
    0.1, 0.1, 0.1,  # 7  index_dip
    1.0, 1.0, 1.0,  # *8  index_tip
    0.1, 0.1, 0.1,  # 9  middle_mcp
    0.1, 0.1, 0.1,  # 10 middle_pip
    0.1, 0.1, 0.1,  # 11 middle_dip
    0.1, 0.1, 0.1,  # 12 middle_tip
    0.1, 0.1, 0.1,  # 13 ring_mcp
    0.1, 0.1, 0.1,  # 14 ring_pip
    0.1, 0.1, 0.1,  # 15 ring_dip
    0.1, 0.1, 0.1,  # 16 ring_tip
    0.1, 0.1, 0.1,  # 17 pinky_mcp
    0.1, 0.1, 0.1,  # 18 pinky_pip
    0.1, 0.1, 0.1,  # 19 pinky_dip
    0.1, 0.1, 0.1,  # 20 pinky_tip
  ]

